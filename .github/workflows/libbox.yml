name: Build Library

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Android, iOS, or both'
        required: true
        type: choice
        options:
          - android
          - ios
          - both
      release_tag:
        description: 'Git tag for release (example: v1.2.3)'
        required: true
        type: string
      release_name:
        description: 'Release name (git tag if empty)'
        required: false
        type: string
      draft:
        description: 'Is draft?'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Is prerelease?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-library-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build_android:
    if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless
          java --version

      - name: Install sagernet gomobile and gobind
        run: |
          # `gomobile init` would install gobind@latest; bind needs only gobind on PATH.
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12 github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          for tool in gomobile gobind; do
            info="$(go version -m "$(go env GOPATH)/bin/$tool")"
            echo "$info"
            grep -qxF "$(printf '\tpath\tgithub.com/sagernet/gomobile/cmd/%s' "$tool")" <<< "$info"
            grep -qxF "$(printf '\tmod\tgithub.com/sagernet/gomobile\tv0.1.12\th1:XwzjZaclFF96deLqwAgK8gU3w0M2A8qxgDmhV+A0wjg=')" <<< "$info"
          done

      - name: Build Android Library
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Android Artifact (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar

  build_ios:
    if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
    runs-on: macos-latest
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25.0'

      - name: Install sagernet gomobile and init
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

      - name: Build iOS Library
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios

      - name: Zip XCFramework with tag
        run: |
          zip -r "Libbox-${{ github.event.inputs.release_tag }}.xcframework.zip" Libbox.xcframework

      - name: Upload iOS Artifact (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: libbox-xcframework
          path: Libbox-${{ github.event.inputs.release_tag }}.xcframework.zip

  publish_release:
    needs: [build_android, build_ios]
    runs-on: ubuntu-latest
    if: >
      ${{
        always() &&
        (
          (github.event.inputs.platform == 'android' && needs.build_android.result == 'success') ||
          (github.event.inputs.platform == 'ios' && needs.build_ios.result == 'success') ||
          (github.event.inputs.platform == 'both' && needs.build_android.result == 'success' && needs.build_ios.result == 'success')
        )
      }}
    steps:
      - name: Download Android artifact
        if: ${{ needs.build_android.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: dist

      - name: Download iOS artifact
        if: ${{ needs.build_ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: libbox-xcframework
          path: dist

      - name: Publish GitHub Release (Android/iOS/both)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || github.event.inputs.release_tag }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          omitBody: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
